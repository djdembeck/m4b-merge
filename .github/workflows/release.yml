# Publish-only release pipeline for the promoted main SHA (no-sync model).
#
# Versions are prepared on develop (scripts/release.py prepare) and promoted
# to main with a release/v*-*-* PR merging the frozen develop tree. This
# workflow never recomputes versions, never edits Cargo files, and never
# syncs main back to develop. It publishes exactly the commit it runs on:
#
#   1. check:            the SHA must belong to main and its version must be
#                        new (helper check-publication). No tag yet.
#   2. test / binaries:  full real test suite (ffmpeg installed on Linux)
#                        and the existing Linux/macOS/Windows binaries, all
#                        from Cargo.lock.
#   3. docker:           native amd64 + arm64 builds pushed as immutable
#                        SHA staging tags (sha-<sha>-<arch>), which may be
#                        pushed before the tag.
#   4. tag:              ONLY after test + binaries + docker succeed, the
#                        helper creates the vX.Y.Z tag and the GitHub
#                        release (empty notes — the Annalist GitHub App
#                        fills the body via webhook).
#   5. manifest:         the SHA staging images are retagged
#                        vX.Y.Z-amd64/arm64 and assembled into the canonical
#                        multi-arch vX.Y.Z manifest — every published image
#                        was built from this SHA.
#   6. upload:           missing release assets are uploaded (existing
#                        assets are never overwritten).
#
# Immutability and retry semantics:
#   - The tag is created only by the helper: never for a different commit —
#     no fallback to an older version, no rollback of latest.
#   - An interrupted publish is resumed by re-running this workflow: the tag
#     (if it already points at this SHA) is reused, the release is reused,
#     missing assets are filled in, and missing image parts are added.
#     SHA staging images from earlier partial runs are kept and reused.
#
# Requires no repo secrets — GITHUB_TOKEN is provided automatically.
# There is deliberately no tag push trigger: tag creation happens inside
# this pipeline, and a competing tag-triggered build would race it.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize the entire publication, including retries and newer main SHAs.
  group: release
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Manual dispatch exists only to resume an interrupted publication from
  # main. From any other ref every real job would skip and the run would
  # end green — fail loudly so a wrong-ref dispatch can never look like a
  # completed retry.
  ref-guard:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse non-main dispatch
        run: |
          echo "::error::The Release workflow must run from main"
          exit 1

  # ─────────────────────────────────────────────────────────────────
  # Validate the promoted SHA. All version knowledge comes from the
  # frozen source manifests; the helper prints the bare vX.Y.Z.
  # ─────────────────────────────────────────────────────────────────
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Check publication (SHA on main, version new, tag absent or identical)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 scripts/release.py check-publication --sha "${{ github.sha }}")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${VERSION} for ${GITHUB_SHA}"

  # ─────────────────────────────────────────────────────────────────
  # Real test suite against the promoted SHA.
  # ─────────────────────────────────────────────────────────────────
  test:
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install ffmpeg (tests invoke the CLI)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: cargo test --all-features --locked

  # ─────────────────────────────────────────────────────────────────
  # The existing binaries for the tested SHA. The built binary must
  # report the checked-out release version before it is published.
  # ─────────────────────────────────────────────────────────────────
  binaries:
    needs: [check]
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            name: linux
          - runs-on: macos-latest
            name: macos
          - runs-on: windows-latest
            name: windows
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build and verify version
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          EXE: ${{ matrix.name == 'windows' && '.exe' || '' }}
        run: |
          set -euo pipefail
          cargo build --release --locked
          BUILT=$("./target/release/m4b-merge${EXE}" --version)
          echo "Built: ${BUILT}"
          [[ "${BUILT}" == "m4b-merge ${VERSION#v}" ]] || {
            echo "Binary version ${BUILT} does not match release ${VERSION}"
            exit 1
          }

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          EXE=${{ matrix.name == 'windows' && '.exe' || '' }}
          cp "target/release/m4b-merge${EXE}" "artifacts/m4b-merge-${{ matrix.name }}${EXE}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m4b-merge-${{ matrix.name }}
          path: artifacts/m4b-merge-${{ matrix.name }}*

  # ─────────────────────────────────────────────────────────────────
  # Native Docker builds (amd64 + arm64) of the tested SHA, pushed as
  # immutable staging tags sha-<sha>-<arch>. No version tags before the
  # tag exists.
  # ─────────────────────────────────────────────────────────────────
  docker-amd64:
    needs: [check]
    outputs:
      digest: ${{ steps.capture.outputs.digest }}
    env:
      # Job-level env cannot read the workflow env context; build the
      # reference from github.repository (identical value to the workflow env).
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.check.outputs.version }}
      SHA: ${{ github.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing staging image provenance
        id: existing
        run: python3 scripts/publish_release.py stage --image "$IMAGE" --sha "$SHA" --version "$VERSION" --arch amd64

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: steps.existing.outputs.exists != 'true'
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-amd64
          build-args: VERSION=${{ needs.check.outputs.version }}
          cache-from: type=gha,scope=release-amd64
          cache-to: type=gha,scope=release-amd64,mode=max
          platforms: linux/amd64

      - name: Capture verified immutable digest
        id: capture
        run: python3 scripts/publish_release.py stage --required --image "$IMAGE" --sha "$SHA" --version "$VERSION" --arch amd64

  docker-arm64:
    needs: [check]
    outputs:
      digest: ${{ steps.capture.outputs.digest }}
    env:
      # Job-level env cannot read the workflow env context; build the
      # reference from github.repository (identical value to the workflow env).
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.check.outputs.version }}
      SHA: ${{ github.sha }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing staging image provenance
        id: existing
        run: python3 scripts/publish_release.py stage --image "$IMAGE" --sha "$SHA" --version "$VERSION" --arch arm64

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: steps.existing.outputs.exists != 'true'
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-arm64
          build-args: VERSION=${{ needs.check.outputs.version }}
          cache-from: type=gha,scope=release-arm64
          cache-to: type=gha,scope=release-arm64,mode=max
          platforms: linux/arm64

      - name: Capture verified immutable digest
        id: capture
        run: python3 scripts/publish_release.py stage --required --image "$IMAGE" --sha "$SHA" --version "$VERSION" --arch arm64

  # ─────────────────────────────────────────────────────────────────
  # The immutable tag — only after test + binaries + docker succeeded.
  # The helper refuses to point it at any different SHA. The GitHub
  # release is created empty; Annalist fills the body via webhook.
  # ─────────────────────────────────────────────────────────────────
  tag:
    permissions:
      contents: write
    needs: [check, test, binaries, docker-amd64, docker-arm64]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Create immutable tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(python3 scripts/release.py tag --sha "${{ github.sha }}")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release (reuse if present)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "${TAG}" --repo "$GITHUB_REPOSITORY" --title "Release ${TAG}" --notes ""

  # ─────────────────────────────────────────────────────────────────
  # Publish the multi-arch image. The SHA staging images were built
  # from this SHA, so every tag they receive points at the same
  # commit's build. Re-runs reuse everything already in place.
  # ─────────────────────────────────────────────────────────────────
  manifest:
    needs: [check, tag, docker-amd64, docker-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Assemble multi-arch manifest (validate before reuse)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.check.outputs.version }}
          SHA: ${{ github.sha }}
          AMD64: ${{ needs.docker-amd64.outputs.digest }}
          ARM64: ${{ needs.docker-arm64.outputs.digest }}
        run: python3 scripts/publish_release.py manifest --image "$IMAGE" --sha "$SHA" --version "$VERSION" --amd64 "$AMD64" --arm64 "$ARM64"

  # ─────────────────────────────────────────────────────────────────
  # Fill in release assets that are missing. Existing assets are
  # never overwritten, replaced, or renamed.
  # ─────────────────────────────────────────────────────────────────
  upload:
    permissions:
      contents: write
    needs: [tag, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Upload missing release assets (validate before reuse)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
          SHA: ${{ github.sha }}
        run: python3 scripts/publish_release.py assets --repo "$GITHUB_REPOSITORY" --tag "$TAG" --sha "$SHA" --artifacts artifacts
