# One normal develop -> main promotion selects and reserves a release identity.
# The same frozen source/version builds every binary and image. No source writes,
# preparation/candidate branches, or merge-back. Draft assets complete before
# publication; Annalist GitHub App fills notes on the published release.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit vX.Y.Z; empty selects from reachable reservations"
        required: false
        default: ""
      bump:
        description: "auto, patch, minor, or major"
        required: false
        default: auto

permissions:
  contents: read

concurrency:
  # Serialize the entire publication, including retries and newer main SHAs.
  group: release
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Wrong-ref dispatch fails before any write-scoped job starts.
  ref-guard:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse non-main dispatch
        run: |
          echo "::error::The Release workflow must run from main"
          exit 1

  # ─────────────────────────────────────────────────────────────────
  # Reserve the frozen source before any external artifact publication.
  # ─────────────────────────────────────────────────────────────────
  check:
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Reserve the exact-source release identity
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.sha }}
          VERSION_INPUT: ${{ inputs.version }}
          BUMP_INPUT: ${{ inputs.bump }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          args=(--sha "$SOURCE" --bump "${BUMP_INPUT:-auto}")
          if [[ -n "$VERSION_INPUT" ]]; then args+=(--version "$VERSION_INPUT"); fi
          if [[ "$RELEASE_EVENT" == push ]]; then args+=(--automatic); fi
          VERSION=$(python3 scripts/release.py reserve "${args[@]}")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Reserved ${VERSION:-no version (superseded automatic candidate)} for ${SOURCE}"

  # ─────────────────────────────────────────────────────────────────
  # Real test suite against the promoted SHA.
  # ─────────────────────────────────────────────────────────────────
  test:
    needs: [check]
    if: needs.check.outputs.version != ''
    env:
      M4B_MERGE_VERSION: ${{ needs.check.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install ffmpeg (tests invoke the CLI)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: cargo test --all-features --locked

  # ─────────────────────────────────────────────────────────────────
  # The existing macOS/Windows binaries for the tested SHA. The built
  # binary must report the checked-out release version before it is
  # published. Linux assets are produced by linux-assets from the
  # verified native image bytes (never built here).
  # ─────────────────────────────────────────────────────────────────
  binaries:
    needs: [check]
    if: needs.check.outputs.version != ''
    env:
      M4B_MERGE_VERSION: ${{ needs.check.outputs.version }}
    strategy:
      matrix:
        include:
          - runs-on: macos-latest
            name: macos
          - runs-on: windows-latest
            name: windows
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build and verify version
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          EXE: ${{ matrix.name == 'windows' && '.exe' || '' }}
        run: |
          set -euo pipefail
          cargo build --release --locked
          BUILT=$("./target/release/m4b-merge${EXE}" --version)
          echo "Built: ${BUILT}"
          [[ "${BUILT}" == "m4b-merge ${VERSION#v}" ]] || {
            echo "Binary version ${BUILT} does not match release ${VERSION}"
            exit 1
          }

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          EXE=${{ matrix.name == 'windows' && '.exe' || '' }}
          cp "target/release/m4b-merge${EXE}" "artifacts/m4b-merge-${{ matrix.name }}${EXE}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m4b-merge-${{ matrix.name }}
          path: artifacts/m4b-merge-${{ matrix.name }}*

  # ─────────────────────────────────────────────────────────────────
  # Native Docker builds (amd64 + arm64) of the tested SHA, pushed as
  # immutable staging tags sha-<sha>-<arch>. No version tags before the
  # tag exists.
  # ─────────────────────────────────────────────────────────────────
  docker-amd64:
    needs: [check]
    if: needs.check.outputs.version != ''
    outputs:
      digest: ${{ steps.capture.outputs.digest }}
    env:
      # Job-level env cannot read the workflow env context; build the
      # reference from github.repository (identical value to the workflow env).
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.check.outputs.version }}
      SHA: ${{ github.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing staging image provenance
        id: existing
        run: python3 scripts/publish_release.py stage --image "$IMAGE" --sha "$SHA" --version "$VERSION" --arch amd64

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: steps.existing.outputs.exists != 'true'
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-amd64
          build-args: |
            VERSION=${{ needs.check.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=release-amd64
          cache-to: type=gha,scope=release-amd64,mode=max
          platforms: linux/amd64

      - name: Capture verified immutable digest
        id: capture
        run: python3 scripts/publish_release.py stage --required --image "$IMAGE" --sha "$SHA" --version "$VERSION" --arch amd64

  docker-arm64:
    needs: [check]
    if: needs.check.outputs.version != ''
    outputs:
      digest: ${{ steps.capture.outputs.digest }}
    env:
      # Job-level env cannot read the workflow env context; build the
      # reference from github.repository (identical value to the workflow env).
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.check.outputs.version }}
      SHA: ${{ github.sha }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing staging image provenance
        id: existing
        run: python3 scripts/publish_release.py stage --image "$IMAGE" --sha "$SHA" --version "$VERSION" --arch arm64

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: steps.existing.outputs.exists != 'true'
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-arm64
          build-args: |
            VERSION=${{ needs.check.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=release-arm64
          cache-to: type=gha,scope=release-arm64,mode=max
          platforms: linux/arm64

      - name: Capture verified immutable digest
        id: capture
        run: python3 scripts/publish_release.py stage --required --image "$IMAGE" --sha "$SHA" --version "$VERSION" --arch arm64

  # ─────────────────────────────────────────────────────────────────
  # Linux release assets: extract the exact bytes from the verified
  # native SHA staging image (digest-pinned, provenance-checked, never
  # stripped again), then prove them on the native runner with the
  # static-musl smoke and the GNU-musl parity benchmark: measurement
  # noise and inconclusive bounds are advisory (per-case distributions
  # are uploaded for review), but a functional merge/probe failure
  # fails this job and blocks the tag, on which path the report is
  # never written. A validation-only GNU build from this same
  # checkout/lockfile is the baseline; it is benchmarked but never
  # staged as a release asset.
  # ─────────────────────────────────────────────────────────────────
  linux-assets:
    needs: [check, docker-amd64, docker-arm64]
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            gnu-target: x86_64-unknown-linux-gnu
            asset: m4b-merge-linux
            digest: ${{ needs.docker-amd64.outputs.digest }}
          - runner: ubuntu-24.04-arm
            arch: arm64
            gnu-target: aarch64-unknown-linux-gnu
            asset: m4b-merge-linux-arm64
            digest: ${{ needs.docker-arm64.outputs.digest }}
    runs-on: ${{ matrix.runner }}
    env:
      # Job-level env cannot read the workflow env context; build the
      # reference from github.repository (identical value to the workflow env).
      IMAGE: ghcr.io/${{ github.repository }}
      SHA: ${{ github.sha }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          # Arch-scoped: ~/.cargo/bin holds arch-specific rust shims, and
          # sharing the amd64 key with the arm64 leg would restore the
          # wrong binaries over the freshly installed toolchain.
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install native verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg binutils build-essential \
            pkg-config cmake perl ca-certificates

      - name: Extract verified asset bytes from the digest-pinned image
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/publish_release.py extract \
            --image "$IMAGE" \
            --digest "${{ matrix.digest }}" \
            --sha "$SHA" --version "$VERSION" --arch "$ARCH" \
            --output "artifacts/${{ matrix.asset }}"
        env:
          ARCH: ${{ matrix.arch }}

      - name: Native smoke (exact bytes, stripped, real merges)
        run: |
          set -euo pipefail
          python3 scripts/verify_linux_asset.py smoke \
            --binary "artifacts/${{ matrix.asset }}" \
            --version "$VERSION" --arch "$ARCH" --expect-stripped
        env:
          ARCH: ${{ matrix.arch }}

      - name: Container smoke (debian:12-slim, asset read-only)
        run: |
          set -euo pipefail
          PACKAGES="python3 ffmpeg binutils ca-certificates"
          docker run --rm \
            -v "$PWD/scripts/verify_linux_asset.py:/verify/linux_asset.py:ro" \
            -v "$PWD/artifacts/:/verify/artifacts/:ro" \
            debian:12-slim \
            /bin/sh -c "apt-get update -y && apt-get install -y $PACKAGES && \
              python3 /verify/linux_asset.py smoke \
                --binary /verify/artifacts/$ASSET \
                --version $VERSION --arch $ARCH --expect-stripped"
        env:
          ARCH: ${{ matrix.arch }}
          ASSET: ${{ matrix.asset }}

      - name: Container smoke (alpine:3.24, asset read-only)
        run: |
          set -euo pipefail
          PACKAGES="python3 ffmpeg binutils ca-certificates"
          docker run --rm \
            -v "$PWD/scripts/verify_linux_asset.py:/verify/linux_asset.py:ro" \
            -v "$PWD/artifacts/:/verify/artifacts/:ro" \
            alpine:3.24 \
            /bin/sh -c "apk add --no-cache $PACKAGES && \
              python3 /verify/linux_asset.py smoke \
                --binary /verify/artifacts/$ASSET \
                --version $VERSION --arch $ARCH --expect-stripped"
        env:
          ARCH: ${{ matrix.arch }}
          ASSET: ${{ matrix.asset }}

      - name: Build validation-only GNU baseline (never published)
        env:
          GNU_TARGET: ${{ matrix.gnu-target }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/gnu-baseline-target
        run: |
          set -euo pipefail
          rustup target add "$GNU_TARGET"
          cargo build --release --locked --target "$GNU_TARGET"

      - name: Native parity benchmark (GNU baseline vs musl asset; functional failures block the tag)
        env:
          GNU_TARGET: ${{ matrix.gnu-target }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/gnu-baseline-target
          ARCH: ${{ matrix.arch }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          python3 scripts/verify_linux_asset.py benchmark \
            --baseline "$CARGO_TARGET_DIR/$GNU_TARGET/release/m4b-merge" \
            --candidate "artifacts/$ASSET" \
            --version "$VERSION" --arch "$ARCH" \
            --report "$RUNNER_TEMP/parity-$ARCH.json"

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-parity-${{ matrix.arch }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/parity-${{ matrix.arch }}.json

      - name: Upload verified Linux asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: artifacts/${{ matrix.asset }}

  # Create a draft after verification; publish it only after all outputs finish.
  # ─────────────────────────────────────────────────────────────────
  tag:
    permissions:
      contents: write
    needs: [check, test, binaries, docker-amd64, docker-arm64, linux-assets]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Reuse reserved identity and create a draft release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.version }}
          SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/release.py release --tag "$TAG" --source "$SOURCE"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────
  # Publish the multi-arch image. The SHA staging images were built
  # from this SHA, so every tag they receive points at the same
  # commit's build. Re-runs reuse everything already in place.
  # ─────────────────────────────────────────────────────────────────
  manifest:
    needs: [check, tag, docker-amd64, docker-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Assemble multi-arch manifest (validate before reuse)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.check.outputs.version }}
          SHA: ${{ github.sha }}
          AMD64: ${{ needs.docker-amd64.outputs.digest }}
          ARM64: ${{ needs.docker-arm64.outputs.digest }}
        run: python3 scripts/publish_release.py manifest --image "$IMAGE" --sha "$SHA" --version "$VERSION" --amd64 "$AMD64" --arm64 "$ARM64"

  # ─────────────────────────────────────────────────────────────────
  # Fill in release assets that are missing. Existing assets are
  # never overwritten, replaced, or renamed.
  # ─────────────────────────────────────────────────────────────────
  upload:
    permissions:
      contents: write
    needs: [tag, binaries, linux-assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          # Per-artifact folders are the staging layout the publisher
          # expects; non-matching artifacts (parity evidence) stay out.
          pattern: m4b-merge-*

      - name: Upload missing release assets (validate before reuse)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
          SHA: ${{ github.sha }}
        run: >-
          python3 scripts/publish_release.py assets
          --repo "$GITHUB_REPOSITORY" --tag "$TAG" --sha "$SHA" --artifacts artifacts
          --asset m4b-merge-linux --asset m4b-merge-linux-arm64
          --asset m4b-merge-macos --asset m4b-merge-windows.exe

  publish:
    needs: [check, tag, manifest, upload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish the complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.version }}
          SOURCE: ${{ github.sha }}
        run: python3 scripts/release.py release --tag "$TAG" --source "$SOURCE" --publish
