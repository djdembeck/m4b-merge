name: CI

on:
  # No event-level path filters: required checks must report on every PR,
  # including docs/workflow-only changes (Release policy stays mergeable).
  push:
    branches: [main, develop]

  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Path classifier for selective CI. Runs first and needs no Rust toolchain:
  # it diffs the PR's merge base (or a push's before SHA) against the event
  # head and maps changed paths onto five concern flags (workflow, lint,
  # build, test, docker) that gate every downstream job. Any uncertainty —
  # missing base, git error, unexpected shell failure — fails safe with
  # every flag enabled so CI never silently under-covers.
  changes:
    runs-on: ubuntu-latest
    outputs:
      workflow: ${{ steps.scope.outputs.workflow }}
      lint: ${{ steps.scope.outputs.lint }}
      build: ${{ steps.scope.outputs.build }}
      test: ${{ steps.scope.outputs.test }}
      docker: ${{ steps.scope.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Event fields reach the script through step env (never inline ${{ }}
      # interpolation) so the script stays injection-safe and shellcheck-clean
      # under actionlint.
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # The runner injects `bash -e` for run scripts; turn it off — this
          # classifier self-handles every failure fail-safe instead of
          # aborting before the outputs are emitted.
          set +e
          set -uo pipefail

          W=0 L=0 B=0 T=0 D=0
          BASE='' HEAD=''
          DO_DIFF=1
          NOTE='classified by changed paths'

          # Unexpected shell/git error → every concern on; outputs are still
          # emitted below and the step stays green so downstream jobs run.
          # shellcheck disable=SC2317  # body runs from the ERR trap, not a call site
          on_err() {
            local rc=$1 line=$2
            trap - ERR
            W=1 L=1 B=1 T=1 D=1
            NOTE="fail-safe: unexpected error (exit ${rc}, line ${line}) — running all concerns"
            printf '::warning::%s\n' "$NOTE"
          }
          trap 'on_err "$?" "$LINENO"' ERR

          # Fail-safe helper: enable every concern.
          all_true() { W=1 L=1 B=1 T=1 D=1; }

          case "$EVENT_NAME" in
            pull_request)
              BASE="$PR_BASE_SHA"
              HEAD="$PR_HEAD_SHA"
              if [ -z "$BASE" ] || ! git rev-parse --verify -q "$BASE^{commit}" >/dev/null 2>&1; then
                all_true
                DO_DIFF=0
                NOTE='fail-safe: pull_request base SHA empty or unresolvable — running all concerns'
                printf '::warning::%s\n' "$NOTE"
              else
                # Diff from the merge base (the PR's divergence point), not the
                # current target-branch tip: against the tip, target-only
                # changes would be misattributed to the PR and a docs-only PR
                # would become a full run whenever the target branch moved.
                MERGE_BASE=$(git merge-base "$BASE" "$HEAD" 2>/dev/null)
                if [ -z "$MERGE_BASE" ]; then
                  all_true
                  DO_DIFF=0
                  NOTE='fail-safe: merge-base resolution failed — running all concerns'
                  printf '::warning::%s\n' "$NOTE"
                else
                  BASE="$MERGE_BASE"
                  if [ "$BASE" = "$HEAD" ]; then
                    all_true
                    DO_DIFF=0
                    NOTE='fail-safe: pull_request base equals head (same-SHA event) — running all concerns'
                    printf '::warning::%s\n' "$NOTE"
                  fi
                fi
              fi
              ;;
            push)
              if [[ "$GIT_REF" == refs/tags/v* ]]; then
                all_true
                DO_DIFF=0
                NOTE='tag push: full run, no diff'
              else
                BASE="$PUSH_BEFORE"
                HEAD="$HEAD_SHA"
                if [ -z "$BASE" ] || [ -z "${BASE//0/}" ] || ! git rev-parse --verify -q "$BASE^{commit}" >/dev/null 2>&1; then
                  all_true
                  DO_DIFF=0
                  NOTE='fail-safe: push base (github.event.before) empty, all-zero, or unresolvable — running all concerns'
                  printf '::warning::%s\n' "$NOTE"
                elif [ "$BASE" = "$HEAD" ]; then
                  all_true
                  DO_DIFF=0
                  NOTE='fail-safe: push base equals head (recreated branch) — running all concerns'
                  printf '::warning::%s\n' "$NOTE"
                fi
              fi
              ;;
            workflow_dispatch)
              all_true
              DO_DIFF=0
              NOTE='workflow_dispatch: manual run — full run, no diff'
              ;;
            *)
              all_true
              DO_DIFF=0
              NOTE="fail-safe: unhandled event '$EVENT_NAME' — running all concerns"
              printf '::warning::%s\n' "$NOTE"
              ;;
          esac

          if [ "$DO_DIFF" -eq 1 ]; then
            # The diff runs exactly once into a temp file so its exit status
            # is checked explicitly; nonzero exit or empty output → fail-safe
            # full run.
            DIFF_FILE=$(mktemp)
            if [ -z "$DIFF_FILE" ]; then
              all_true
              DO_DIFF=0
              NOTE='fail-safe: could not create temp file for git diff — running all concerns'
              printf '::warning::%s\n' "$NOTE"
            else
              if ! git diff --name-only -z --no-renames "$BASE" "$HEAD" >"$DIFF_FILE" || [ ! -s "$DIFF_FILE" ]; then
                rm -f "$DIFF_FILE"
                all_true
                DO_DIFF=0
                NOTE='fail-safe: git diff failed or produced no output — running all concerns'
                printf '::warning::%s\n' "$NOTE"
              else
                # NUL-safe loop in the current shell so flag mutations survive;
                # --no-renames makes a rename emit both paths, so a code→docs
                # rename still classifies by its departed heavy path. Case-arm
                # order matters: .github/workflows/* must win over .github/*.md.
                # shellcheck disable=SC2221,SC2222  # safe-ignore arm list is spec-mandated; *.md subsumes CHANGELOG.md/.github/*.md in bash case globs
                while IFS= read -r -d '' path; do
                  case "$path" in
                    .github/workflows/*) W=1 ;;
                    Cargo.toml|Cargo.lock) L=1 B=1 T=1 D=1 ;;
                    clippy.toml|rustfmt.toml) L=1 ;;
                    src/*) L=1 B=1 T=1 D=1 ;;
                    tests/*) L=1 T=1 ;;
                    Dockerfile|.dockerignore) D=1 ;;
                    *.md|docs/*|LICENSE|.gitignore|.pre-commit-config.yaml|renovate.json5|.github/*.md|CHANGELOG.md|CONTRIBUTING.md) : ;;
                    *) W=1 L=1 B=1 T=1 D=1 ;;
                  esac
                done <"$DIFF_FILE"
                rm -f "$DIFF_FILE"
              fi
            fi
          fi

          flag() {
            if [ "$1" -eq 1 ]; then printf 'true'; else printf 'false'; fi
          }
          {
            echo "workflow=$(flag "$W")"
            echo "lint=$(flag "$L")"
            echo "build=$(flag "$B")"
            echo "test=$(flag "$T")"
            echo "docker=$(flag "$D")"
          } >>"$GITHUB_OUTPUT"

          {
            echo '### Changed-path classification'
            echo ''
            echo '| Concern | Enabled | Gates |'
            echo '| --- | --- | --- |'
            echo "| workflow | $(flag "$W") | workflow-lint (actionlint over .github/workflows/**) |"
            echo "| lint | $(flag "$L") | lint-format (cargo fmt --check, clippy --all-features, cargo audit) |"
            echo "| build | $(flag "$B") | build (cargo check --all-features) |"
            echo "| test | $(flag "$T") | test (ffmpeg + cargo test --all-features) |"
            echo "| docker | $(flag "$D") | docker-amd64, docker-arm64, docker-manifest |"
            echo ''
            echo "> Note: ${NOTE}"
          } >>"$GITHUB_STEP_SUMMARY"

          exit 0

  workflow-lint:
    # actionlint over workflow-only changes. Kept separate from lint-format so
    # workflow PRs pay neither a Rust toolchain nor a container setup.
    needs: [changes]
    if: ${{ !cancelled() && needs['changes'].result == 'success' && needs['changes'].outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          # This repo has no go.mod/go.sum — skip module cache restoration.
          cache: false

      - name: Lint workflows (actionlint)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  lint-format:
    needs: [changes]
    if: ${{ !cancelled() && needs['changes'].result == 'success' && needs['changes'].outputs.lint == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run release helper behavior tests
        run: python3 -m unittest discover -s scripts -p 'test_release.py'

      - name: Run publisher reconciliation behavior tests
        run: python3 -m unittest discover -s scripts -p 'test_publish_release.py'

      - name: Run Linux asset gate behavior tests
        run: python3 -m unittest discover -s scripts -p 'test_verify_linux_asset.py'

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96
          components: clippy, rustfmt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: cargo fmt --check

      - run: cargo clippy --all-features -- -D warnings

  build:
    needs: [changes, workflow-lint, lint-format]
    if: ${{ !cancelled() && needs['changes'].result == 'success' && needs['changes'].outputs.build == 'true'
            && (needs['workflow-lint'].result == 'success' || needs['workflow-lint'].result == 'skipped')
            && (needs['lint-format'].result == 'success' || needs['lint-format'].result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: cargo check --locked --all-features

  test:
    needs: [changes, workflow-lint, lint-format, build]
    if: ${{ !cancelled() && needs['changes'].result == 'success' && needs['changes'].outputs.test == 'true'
            && (needs['workflow-lint'].result == 'success' || needs['workflow-lint'].result == 'skipped')
            && (needs['lint-format'].result == 'success' || needs['lint-format'].result == 'skipped')
            && (needs['build'].result == 'success' || needs['build'].result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: cargo test --all-features --locked

  # PRs verify the containerized amd64 build without publishing an image.
  # Dependency/lockfile changes alter inputs compiled inside the image and can
  # expose container-specific failures (toolchain, linker, native libs) without
  # touching the Dockerfile, so this stays a real build, not a shortcut.
  docker-check:
    needs: [changes, workflow-lint, lint-format, build, test]
    if: ${{ !cancelled() && needs['changes'].result == 'success' && needs['changes'].outputs.docker == 'true'
            && (needs['workflow-lint'].result == 'success' || needs['workflow-lint'].result == 'skipped')
            && (needs['lint-format'].result == 'success' || needs['lint-format'].result == 'skipped')
            && (needs['build'].result == 'success' || needs['build'].result == 'skipped')
            && (needs['test'].result == 'success' || needs['test'].result == 'skipped')
            && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # create-or-update-comment on same-repo PRs needs PR write; explicit
      # job permissions set everything omitted to none.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Docker image (verification only, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
          platforms: linux/amd64

      # Post a "Checked, not published" comment on same-repo PRs (create-only, never update)
      - name: Find existing PR comment
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          !endsWith(github.event.pull_request.user.login, '[bot]') &&
          github.event.pull_request.user.login != 'renovate[bot]' &&
          github.event.pull_request.user.login != 'app/renovate'
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: Docker build check

      - name: Post Docker build check comment
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          !endsWith(github.event.pull_request.user.login, '[bot]') &&
          github.event.pull_request.user.login != 'renovate[bot]' &&
          github.event.pull_request.user.login != 'app/renovate' &&
          steps.find-comment.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 🐳 Docker build check

            The containerized amd64 build succeeded. This job only verifies
            the build and does not publish. A separate, parallel
            `docker-amd64` job publishes a test image for human same-repo
            PRs once it succeeds (bot PRs skip it):

            ```bash
            docker pull ghcr.io/djdembeck/m4b-merge:pr-${{ github.event.pull_request.number }}
            ```

            If the `docker-amd64` job failed, the image was not published.

            CI publishes preview and SHA images. The release workflow
            publishes the reserved version; no rolling latest alias is maintained.

  docker-amd64:
    # Pushes the -amd64-suffixed images for docker-manifest (main) and the
    # develop preview (develop pushes). Local (non-PR) pushes start from a
    # fully cached, clean worktree, so the pre-Public-publish cost is small.
    needs: [changes, workflow-lint, lint-format, build, test]
    # PRs: only non-bot same-repo authors publish. Renovate's dependency PRs
    # are same-repo (head repo == base) but must NOT publish — docker-check
    # covers them — so the [bot]-author guard is what keeps dep PRs (and
    # other bot PRs, e.g. Dependabot) from reaching this job. Human same-repo
    # PRs and push to main/develop publish.
    if: >-
      !cancelled() && needs['changes'].result == 'success' && needs['changes'].outputs.docker == 'true' &&
      (needs['workflow-lint'].result == 'success' || needs['workflow-lint'].result == 'skipped') &&
      (needs['lint-format'].result == 'success' || needs['lint-format'].result == 'skipped') &&
      (needs['build'].result == 'success' || needs['build'].result == 'skipped') &&
      (needs['test'].result == 'success' || needs['test'].result == 'skipped') &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         !endsWith(github.event.pull_request.user.login, '[bot]') &&
         github.event.pull_request.user.login != 'renovate[bot]' &&
         github.event.pull_request.user.login != 'app/renovate')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Suffix -amd64 on main pushes so docker-manifest can assemble
          # multi-arch; no suffix on develop pushes (single-arch preview at
          # the canonical tag). flavor is CSV — comma-separate options (17bafe6).
          flavor: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'suffix=-amd64,latest=false' || 'latest=false' }}
          # Semver image tags are published exclusively by the Release
          # workflow (never by CI), so no type=semver lines here.
          tags: |
            type=ref,event=branch
            # PR images take the stable pr-{N} tag so pr-cleanup.yml (which
            # deletes pr-{N} package versions on PR close) collects them.
            type=ref,event=pr
            type=sha,enable=${{ github.event_name != 'pull_request' }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          build-args: GIT_COMMIT=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
          platforms: linux/amd64

  docker-arm64:
    # Native arm64 runner only on main pushes; PRs stay amd64-only to keep
    # iteration fast and avoid burning arm64 runner-minutes on every PR.
    needs: [changes, workflow-lint, lint-format, build, test]
    if: ${{ !cancelled() && needs['changes'].result == 'success' && needs['changes'].outputs.docker == 'true' && (needs['workflow-lint'].result == 'success' || needs['workflow-lint'].result == 'skipped') && (needs['lint-format'].result == 'success' || needs['lint-format'].result == 'skipped') && (needs['build'].result == 'success' || needs['build'].result == 'skipped') && (needs['test'].result == 'success' || needs['test'].result == 'skipped') && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Explicit raw latest is suffixed too; latest=false disables only
          # automatic latest generation, not explicit raw tags. Keep CSV flavor.
          flavor: suffix=-arm64,latest=false
          tags: |
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          build-args: GIT_COMMIT=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
          platforms: linux/arm64

  docker-manifest:
    # Assembles the canonical (non-suffixed) multi-arch tags from the
    # per-arch images pushed by docker-amd64 and docker-arm64.
    needs: [docker-amd64, docker-arm64]
    if: ${{ !cancelled() && needs['docker-amd64'].result == 'success' && needs['docker-arm64'].result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Semver image tags are published exclusively by the Release
          # workflow (never by CI), so no type=semver lines here.
          tags: |
            type=ref,event=branch
            type=sha

      - name: Assemble multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          # TAGS holds full image refs (ghcr.io/.../m4b-merge:<tag>). Pass each
          # directly as the manifest target, but source every manifest from
          # this run's immutable SHA-specific images. The arch jobs emit their
          # SHA tag via metadata-action type=sha with no `prefix`/`format` override,
          # i.e. its documented defaults: prefix "sha-", format "short" (the
          # first 7 chars of GITHUB_SHA), plus the per-arch flavor suffix
          # (-amd64/-arm64). main and latest resolve as shared mutable per-arch
          # tags; pinning to this run's SHA keeps overlapping main pushes from
          # mixing commits inside one manifest.
          sha_tag="sha-${GITHUB_SHA::7}"
          echo "$TAGS" | while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            [[ "$ref" != *:* ]] && continue
            docker buildx imagetools create -t "$ref" \
              "$IMAGE:$sha_tag-amd64" \
              "$IMAGE:$sha_tag-arm64"
          done
