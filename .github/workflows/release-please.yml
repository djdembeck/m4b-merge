name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0) — generate AI changelog for an existing release'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        # Manual dispatch runs only the ai-changelog job below; never run the
        # action without a push event (it has no command input to act on).
        if: github.event_name == 'push'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  ai-changelog:
    needs: release-please
    # Auto-run when release-please creates a release (a release PR was merged),
    # or on manual dispatch to (re)generate notes for an existing tag.
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag and previous tag
        id: tags
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            CURRENT_TAG="${INPUT_TAG_NAME}"
          else
            CURRENT_TAG="${{ needs.release-please.outputs.tag_name }}"
          fi
          # Find the tag immediately before CURRENT_TAG (sorted ascending, take last before it)
          PREV_TAG=$(git tag --sort=version:refname | grep -B1 -Fx "${CURRENT_TAG}" | grep -v -Fx "${CURRENT_TAG}" | head -1 || true)
          # Delete any newer tags locally so the action's auto-detect doesn't pick them up
          git tag --sort=version:refname | grep -Fx -A9999 "${CURRENT_TAG}" | tail -n +2 | xargs -r git tag -d || true
          if [ -z "${PREV_TAG}" ]; then
            # No previous tag — create a synthetic v0.0.0 at the root commit
            ROOT_COMMIT=$(git rev-list --max-parents=0 HEAD)
            git tag v0.0.0 "${ROOT_COMMIT}"
            PREV_TAG="v0.0.0"
          fi
          echo "current=${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
          echo "prev=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "Current tag: ${CURRENT_TAG}"
          echo "Previous tag: ${PREV_TAG:-<none, first release>}"

      - uses: nosovj/llm-release-action@aba906f1ff5d376390d9e751bf407f40971079e0 # v1
        id: llm
        with:
          model: openai/${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          current_version: ${{ steps.tags.outputs.prev }}
          head_ref: ${{ steps.tags.outputs.current }}
          max_commits: '100'
          temperature: '0.3'
          max_tokens: '32000'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

      - name: Create or update GitHub Release with AI changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_CHANGLOGS: ${{ steps.llm.outputs.changelogs }}
          RELEASE_TAG: ${{ steps.tags.outputs.current }}
        run: |
          CHANGELOG=$(jq -r '.default.en' <<< "$LLM_CHANGLOGS" 2>/dev/null) || true
          if [ -z "$CHANGELOG" ] || [ "$CHANGELOG" = "null" ]; then
            echo "No changelog generated, keeping default release notes"
            exit 0
          fi
          # create-or-edit: future releases already exist (release-please made them);
          # manual backfills of orphan tags have no GitHub Release yet, so create one.
          gh release create "$RELEASE_TAG" --notes "$CHANGELOG" --verify-tag 2>/dev/null \
            || gh release edit "$RELEASE_TAG" --notes "$CHANGELOG"
