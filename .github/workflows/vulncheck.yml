name: Vulnerability check

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulncheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    # Advisory-only: visible failure, never a required gate. The audit
    # step is continue-on-error on bot-authored (Renovate) PRs, so a
    # pre-existing advisory can never block the dependency PRs that fix
    # it, while findings stay visible.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('.github/workflows/vulncheck.yml') }}

      # Pinned for Renovate's regex custom manager in renovate.json5.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked --force

      - name: Audit Cargo.lock
        continue-on-error: >-
          ${{ github.event_name == 'pull_request' &&
             (github.event.pull_request.user.login == 'renovate[bot]' ||
              github.event.pull_request.user.login == 'app/renovate') }}
        run: cargo audit --deny warnings
