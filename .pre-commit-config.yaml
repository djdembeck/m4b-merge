# Generated by setup-ci. Mirrors ci.yml — edit the ci.yml/tool map, not these commands.
# A git commit --no-verify bypass is still caught by ci.yml.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        entry: cargo check --all-features
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        # requires ffmpeg installed locally — mirrors ci.yml test job
        name: cargo test
        entry: cargo test --all-features
        language: system
        pass_filenames: false
        always_run: true
