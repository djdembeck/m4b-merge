# Generated by setup-ci. Mirrors ci.yml — edit the ci.yml/tool map, not these commands.
# A git commit --no-verify bypass is still caught by ci.yml (fmt/clippy/check/test — the audit moved to advisory-only vulncheck.yml).
repos:
  - repo: local
    hooks:
      - id: release-helper-tests
        name: release helper behavior tests
        entry: python3 -m unittest discover -s scripts -p 'test_release.py'
        language: system
        pass_filenames: false
        always_run: true

      - id: publisher-helper-tests
        name: publisher reconciliation behavior tests
        entry: python3 -m unittest discover -s scripts -p 'test_publish_release.py'
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        entry: cargo check --locked --all-features
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        # requires ffmpeg installed locally — mirrors ci.yml test job
        name: cargo test
        entry: cargo test --all-features --locked
        language: system
        pass_filenames: false
        always_run: true
